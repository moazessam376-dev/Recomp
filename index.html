<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="theme-color" content="#131517">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Upper/Lower training log, meal and supplement tracker, and body measurements for a maintenance recomp.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="css/app.css">
<title>Recomp</title>
</head>
<body>

<header>
  <div class="headrow">
    <div>
      <div class="eyebrow" id="datestr">&nbsp;</div>
      <h1 id="greet">Recomp</h1>
    </div>
    <span class="pill-tag" id="weektag">Week 1</span>
  </div>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-body"></section>
  <section class="view" id="v-plan"></section>
</main>

<nav>
  <span class="ind" id="navind"></span>
  <button class="tab on" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg><span class="tl">Today</span></button>
  <button class="tab" data-v="train"><svg viewBox="0 0 24 24"><path d="M4 9v6M7.5 6.5v11M16.5 6.5v11M20 9v6M7.5 12h9"/></svg><span class="tl">Train</span></button>
  <button class="tab" data-v="food"><svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10M17 3c-1.5 2-2 4-2 6.5 0 1.5.7 2.5 2 2.5v9"/></svg><span class="tl">Food</span></button>
  <button class="tab" data-v="body"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/></svg><span class="tl">Body</span></button>
  <button class="tab" data-v="plan"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h3"/></svg><span class="tl">Plan</span></button>
</nav>

<div class="timer" id="timer"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>

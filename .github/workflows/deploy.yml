name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The plan's rules (progression, macros, swaps, check-ins) are tested in
      # Node. A red test stops the deploy before a broken plan reaches the phone.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # Pages itself has to be switched on once by an account admin, under
      # Settings -> Pages -> Source -> GitHub Actions. The workflow token
      # cannot do it: creating a Pages site needs administration scope, which
      # GITHUB_TOKEN is never granted, so enablement:true here just fails with
      # "Resource not accessible by integration". Deploying, below, is fine.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
